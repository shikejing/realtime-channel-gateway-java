server.port=0

# 实时通道网关配置
gateway.heartbeat-interval-ms=10000
gateway.heartbeat-timeout-ms=30000
gateway.session-retention-ms=60000
gateway.replay-window-size=1000
gateway.reorder-window=64
gateway.outbound-queue-capacity=256
gateway.slow-consumer-policy=DISCONNECT

# 示例身份与频道权限（token -> subject，subject -> 频道白名单）
gateway.tokens.token-alice=alice
gateway.tokens.token-bob=bob
gateway.grants.alice=ch-a,ch-b
gateway.grants.bob=ch-b
