# Web 端口不使用，仅保留让 Spring 上下文可启动
server.port=0

# 心跳：客户端超过 heartbeat-interval-ms * heartbeat-miss-threshold 未上行即判定半开
gateway.heartbeat-interval-ms=5000
gateway.heartbeat-miss-threshold=3

# 断线后会话与订阅关系的保留窗口
gateway.session-retention-ms=30000

# 单频道重放窗口（消息条数），超出窗口需重新同步
gateway.channel-replay-window-messages=1000

# 单条连接待发缓冲上限，超限进入可重新同步状态
gateway.connection-buffer-capacity=256

# 本地回环 NIO 端口，-1 表示不启动网络监听（纯内存/测试模式），0 表示临时端口
gateway.loopback-port=0
